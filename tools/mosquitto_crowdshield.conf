# Mosquitto for CrowdShield: MQTT on 1883 (engine, gateway, ESP32 sign) and MQTT over
# WebSocket on 9001 (the UI's fallback source). Start: mosquitto -c tools/mosquitto_crowdshield.conf
# If the system broker already holds 1883, scripts/demo.sh uses it instead.
per_listener_settings false
allow_anonymous true

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

persistence false
log_type error
log_type warning
log_type notice
